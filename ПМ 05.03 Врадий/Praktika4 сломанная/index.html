<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор с тестами</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1> Калькулятор </h1>

    <div class="calculstor">
        <input type="number" id="num1" placeholder="Первое число">
        <select id="operation">
            <option value="+">+</option>
            <option value="*">*</option>
            <option value="-">-</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="Второе число">
        <button onclick="calculate()">Вычислить</button>
        <div id="result"></div>
    </div>

    <button class="test-btn" onclick="RunAllTests()">Запустить тесты</button>
    <div id="tests-output"></div>
    <script src="scrit.js"></script>
    <script src="test.js"></script>
</body>

</html>
