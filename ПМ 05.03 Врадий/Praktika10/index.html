<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку для хеширования (SHA-256) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>

<body>

    <div class="container">
        <!-- Форма Авторизации -->
        <div id="login-form" class="form-box">
            <h2>Вход</h2>
            <form id="authForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required>
                </div>
                <p id="login-error" class="error-msg"></p>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <p class="switch-text">Нет аккаунта? <a href="#" onclick="toggleForms()">Зарегистрироваться</a></p>
        </div>

        <!-- Форма Регистрации -->
        <div id="register-form" class="form-box hidden">
            <h2>Регистрация</h2>
            <form id="regForm">
                <div class="input-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" required>
                    <small id="pass-rules">Мин. 5 символов, 1 цифра</small>
                </div>
                <div class="input-group">
                    <label>Подтверждение пароля</label>
                    <input type="password" id="reg-confirm-password" required>
                </div>
                <p id="reg-error" class="error-msg"></p>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <p class="switch-text">Есть аккаунт? <a href="#" onclick="toggleForms()">Войти</a></p>
        </div>
    </div>

    <script src="security.js"></script>
    <script src="logic.js"></script>
</body>

</html>
